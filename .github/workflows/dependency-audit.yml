name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/node-alpha
          - packages/node-beta
          - packages/node-gamma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            packages/node-alpha/requirements.txt
            packages/node-alpha/constraints.txt
            packages/node-beta/requirements.txt
            packages/node-beta/constraints.txt
            packages/node-gamma/requirements.txt
            packages/node-gamma/constraints.txt
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit==2.7.3
      - name: Install dependencies for ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Audit ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: pip-audit
